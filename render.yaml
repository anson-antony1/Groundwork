# Render Blueprint: two free services from this repo. Setup steps: deploy/README.md.
#   groundwork       the live app: FastAPI backend + built frontend in one Docker web service
#   groundwork-demo  the always-up demo: the frontend in mock mode, as a static site with no backend
services:
  - type: web
    name: groundwork
    runtime: docker
    plan: free
    branch: ui
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Render asks for it when the Blueprint is created
      - key: GROUNDWORK_SENSOR_TOKEN
        generateValue: true # the code default is public, and it guards demo reset
      - key: GROUNDWORK_RATE_LIMIT_PER_MINUTE
        value: "6000" # judges on venue Wi-Fi share one IP
      # Render picks the hostnames (groundwork.onrender.com was taken), so the two sites' addresses
      # are set by hand in the dashboard after the first deploy. See deploy/README.md.
      - key: VITE_DEMO_URL # build arg: /welcome links to the demo site's interactive beacon
        sync: false

  - type: web
    name: groundwork-demo
    runtime: static
    branch: ui
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_MODE
        value: mock
      - key: VITE_TRY_DOCK
        value: "1"
      - key: VITE_LIVE_URL # /welcome links to the live app and shows whether it's awake
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
