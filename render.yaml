# Render Blueprint: two free services from this repo. Setup steps: deploy/README.md.
#   groundwork       the live app: FastAPI backend + built frontend in one Docker web service
#   groundwork-demo  the always-up demo: the frontend in mock mode, as a static site with no backend
# Both deploy every push to main. The Blueprint was created from ui, so Render reads this file there:
# bring changes to it into ui too.
services:
  - type: web
    name: groundwork
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Render asks for it when the Blueprint is created
      - key: GROUNDWORK_SENSOR_TOKEN
        generateValue: true # the code default is public, and it guards demo reset
      - key: GROUNDWORK_RATE_LIMIT_PER_MINUTE
        value: "6000" # judges on venue Wi-Fi share one IP
      # Render picked the hostnames on the first deploy (groundwork.onrender.com belongs to someone else).
      - key: VITE_DEMO_URL # build arg: /welcome links to the demo site's interactive beacon
        value: https://groundwork-demo.onrender.com
      # Auth0 (deploy/README.md "Auth0"). Typed in the dashboard, so a Blueprint sync never overwrites them.
      - key: GROUNDWORK_AUTH_ENABLED # "true" turns role checks on; "false" is the safe fallback
        sync: false
      - key: AUTH0_DOMAIN # e.g. groundwork-demo.us.auth0.com
        sync: false
      - key: VITE_AUTH0_DOMAIN # build arg: same tenant domain, for the Log in button
        sync: false
      - key: VITE_AUTH0_CLIENT_ID # build arg: the "Groundwork Web" single-page app's client ID
        sync: false
      - key: AUTH0_AUDIENCE # the Auth0 API identifier, exactly (no trailing slash)
        value: https://groundwork-api
      - key: AUTH0_ROLES_CLAIM
        value: https://groundwork-api/roles

  - type: web
    name: groundwork-demo
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_MODE
        value: mock
      - key: VITE_TRY_DOCK
        value: "1"
      - key: VITE_LIVE_URL # /welcome links to the live app and shows whether it's awake
        value: https://groundwork-ifbr.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
